<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>The Accountant Show - Design Generator</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <main class="app">

        <!-- =================================
             LEFT PANEL
        ================================== -->

        <section class="controls">

            <div class="header">

                <h1>
                    Design Generator
                </h1>

                <p>
                    Create personalised Accountant Show graphics.
                </p>

            </div>


            <div id="peopleContainer">

                <!-- Person cards will be added here -->

            </div>


            <div class="actions">

                <button
                    id="addPersonBtn"
                    class="secondary-btn"
                >
                    + Add Another Person
                </button>


                <button
                    id="generateAllBtn"
                    class="primary-btn"
                >
                    Generate
                </button>


                <button
                    id="downloadAllBtn"
                    class="download-btn"
                    disabled
                >
                    Download PNG
                </button>

            </div>

        </section>


        <!-- =================================
             RIGHT PANEL
        ================================== -->

        <section class="preview-section">

            <div class="preview-header">

                <h2>
                    Preview
                </h2>

                <span id="previewStatus">
                    No design generated
                </span>

            </div>


            <div class="canvas-wrapper">

                <canvas
                    id="designCanvas"
                    width="1080"
                    height="1080"
                ></canvas>

            </div>

        </section>

    </main>


    <!-- JSZip for batch downloads -->

    <script
        src="./libs/jszip.min.js"
    ></script>


    <script src="script.js"></script>

</body>

</html>
